<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="https://tools.kentanthepropertyguy.com/tools/planner/">

<title>What can I afford? — Groundwork</title>
<style>body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#3B4256;background:#fff}main{max-width:520px;margin:0 auto;padding:56px 22px}h1{font-size:24px;line-height:1.25;color:#16213E;margin:0 0 10px}a{color:#0B63CE;font-weight:600}</style>
<script>
/* The HDB upgrade planner is now part of What can I afford? (24 Oct 2026): the same sell-first budget, worked by the one shared engine, with buy-first,
   the CPF refund, the ABSD refund and a payment timeline on top. Old links keep working: this page sends the visitor there, set up for a flat being sold.
   Figures typed into the old planner in THIS tab (sessionStorage only; nothing leaves the browser) are carried into the same fields so nothing has to be typed twice. */
(function () {
  try {
    var st = window.sessionStorage, raw = st.getItem('kpt.hdb.input') || st.getItem('gw.pro.hdb-upgrade.v1'), i = raw ? JSON.parse(raw) : null;
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? x : null; };
    if (i && n(i.salePrice)) {
      // the flat being sold: the Planner reads gw.sell.v1 when opened at #sell (price, loan left, CPF to refund including accrued interest)
      var sell = { v: 1, type: 'hdb', price: i.salePrice, loan: n(i.outstandingLoan) || 0 };
      if (n(i.cpfRefund)) sell.cpfRefund = i.cpfRefund;
      st.setItem('gw.sell.v1', JSON.stringify(sell));
      // the buyers and the money in hand: the shared figures every calculator reads (a figure already typed elsewhere is left as it is)
      var fin = {}; try { fin = JSON.parse(st.getItem('gw.fin.v1') || '{}') || {}; } catch (e) { fin = {}; }
      var put = function (k, v, age) { if (n(v) && (fin[k] === undefined || fin[k] === '')) fin[k] = age ? String(Math.round(v)) : Math.round(v).toLocaleString('en-US'); };
      (i.buyers || []).slice(0, 2).forEach(function (b, k) { if (b) { put('borrowers.' + k + '.age', b.age, true); put('borrowers.' + k + '.fixed', b.income); } });
      put('cash', i.cashSavings); put('cpfOa', i.otherCpfOa); put('sellPrice', i.salePrice); put('outstandingLoan', i.outstandingLoan); if (!fin.homeType) fin.homeType = 'hdb';
      st.setItem('gw.fin.v1', JSON.stringify(fin));
    }
  } catch (e) { /* no storage: the Planner opens blank, set up for a flat being sold */ }
  try { location.replace('../planner/?j=1' + (location.search && /[?&]resume=1/.test(location.search) ? '&resume=1' : '') + '#sell'); } catch (e) { /* the meta refresh and the link below still work */ }
})();
</script>
</head>
<body>
<main>
<h1>The HDB upgrade planner is now part of What can I afford?</h1>
<p>Enter what your flat could sell for, the loan left on it and the CPF to refund, then your income and savings, for your budget for the next home. It also handles buying before you sell.</p>
<p><a href="../planner/?j=1#sell">Open What can I afford?</a></p>
</main>
</body>
