<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Market data check · Ken Property Tools</title>
<link rel="stylesheet" href="../../assets/css/kpt-system.css">
<style>
 table.chk{ width:100%; border-collapse:collapse; font-size:13px; margin:8px 0 0; }
 table.chk td, table.chk th{ border-top:1px solid var(--line); padding:7px 8px 7px 0; text-align:left; vertical-align:top; }
 .lv{ font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
 .lv.error{ color:#B00020; } .lv.warn{ color:var(--gold); } .lv.ok{ color:var(--wa); }
 .cov td.z{ background:#F7E3E3; } .cov td.n{ text-align:center; }
</style>
</head>
<body>
<header class="kpt-header kpt-shell"><a class="brand" href="../../">KEN PROPERTY TOOLS</a></header>
<main class="kpt-shell" style="max-width:860px;"><div id="root"><p class="kpt-note">Checking…</p></div></main>
<script src="../../assets/js/kpt-market.js"></script>
<script src="../../data/market/config.js"></script>
<script>
(function () {
  const M = window.KPT_MARKET, CFG = window.KPT_MARKET_CONFIG, params = new URLSearchParams(location.search);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  M.load(CFG, (u) => fetch(u), CFG.mode === 'test' ? params.get('scenario') : null).then((d) => {
    const rep = M.diagnose({ bands: d.bands, shortlist: d.shortlist, settings: d.settings, issues: d.issues });
    const conn = d.attempts.map((a) => `<tr><td>${a.ok ? '<span class="lv ok">OK</span>' : '<span class="lv error">Failed</span>'}</td><td>${esc(a.url)}</td><td>${a.ok ? a.bytes + ' bytes' : esc(a.error)}</td></tr>`).join('');
    const iss = rep.issues.length ? rep.issues.map((i) => `<tr><td><span class="lv ${i.level}">${i.level}</span></td><td>${esc(i.where)}${i.row ? ' · row ' + i.row : ''}</td><td>${esc(i.msg)}</td></tr>`).join('')
      : '<tr><td colspan="3"><span class="lv ok">Nothing needs attention.</span></td></tr>';
    const beds = [2, 3, 4], bands = [...new Set(rep.coverage.map((c) => c.band))];
    const cov = `<table class="chk cov"><tr><th>Budget</th>${beds.map((b) => `<th>${b}-bed</th>`).join('')}</tr>` +
      bands.map((bd) => `<tr><td>${bd}</td>${beds.map((b) => { const c = rep.coverage.find((x) => x.band === bd && x.bedroom === b).count; return `<td class="n ${c ? '' : 'z'}">${c}</td>`; }).join('')}</tr>`).join('') + '</table>';
    const staleMsg = d.basis === 'snapshot' ? 'The published Sheet could not be used, so the bundled snapshot is being shown.' : '';
    document.getElementById('root').innerHTML = `
      <div class="kpt-section" style="padding-top:16px;">
        <p class="kpt-eyebrow">Market data check</p>
        <h1 class="kpt-h2">${CFG.mode === 'test' ? 'Test data is active' : 'Production data'} · source: ${esc(d.basis)}</h1>
        <p class="kpt-note">${d.bands.length} market rows · ${d.shortlist.length} shortlist entries · ${rep.counts.errors} errors · ${rep.counts.warnings} warnings. ${esc(staleMsg)}</p></div>
      <hr class="kpt-rule">
      <div class="kpt-section"><p class="kpt-eyebrow">Connection</p><table class="chk">${conn || '<tr><td>No requests made.</td></tr>'}</table>
        <p class="kpt-note">If a link shows "Failed to fetch", the Sheet tab is probably not published to the web as CSV, or the link is wrong.</p></div>
      <hr class="kpt-rule">
      <div class="kpt-section"><p class="kpt-eyebrow">Needs your attention</p><table class="chk">${iss}</table></div>
      <hr class="kpt-rule">
      <div class="kpt-section"><p class="kpt-eyebrow">Shortlist coverage</p>
        <p class="kpt-note">How many entries a visitor would see at each budget and home size. Red cells show visitors the "more specific shortlist" prompt.</p>${cov}</div>`;
  });
})();
</script>
</body></html>
