<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Engine audit · Ken Property Tools</title>
<link rel="stylesheet" href="../../assets/css/kpt-system.css">
<style>
 table.chk{ width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0 0; }
 table.chk td, table.chk th{ border-top:1px solid var(--line); padding:6px 8px 6px 0; text-align:left; vertical-align:top; }
 .lv{ font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; } .lv.error{ color:#B00020; } .lv.warn{ color:var(--gold); } .lv.ok{ color:var(--wa); }
 .sel{ font-weight:700; } .mute{ color:#777; } details{ margin:8px 0; } summary{ cursor:pointer; font-weight:600; }
 .sent{ border-left:3px solid var(--gold); padding:4px 10px; margin:6px 0; } .sent small{ color:#777; display:block; } code{ font-size:11.5px; }
 form.bud{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; } form.bud input{ padding:8px; border:1px solid var(--line); width:140px; }
 .quick a{ margin-right:10px; font-size:13px; }
</style>
</head>
<body>
<header class="kpt-header kpt-shell"><a class="brand" href="../../">KEN PROPERTY TOOLS</a></header>
<main class="kpt-shell" style="max-width:980px;"><div id="root"><p class="kpt-note">Loading…</p></div></main>
<script src="../../assets/js/kpt-engine.js"></script>
<script src="../../data/market/config.js"></script>
<script>
/* Internal engine audit. Not linked from the site, noindex. Shows exactly how the V1 engine reached each conclusion.
   ?budget=1320000   ?today=YYYY-MM-DD (test mode only)   Source: route stats in data/market/route-stats/ (production) or the illustrative test set. */
(function () {
  const ENG = window.KPT_ENGINE, CFG = window.KPT_MARKET_CONFIG, params = new URLSearchParams(location.search);
  const base = CFG.mode === 'test' ? CFG.testRouteStatsBase : CFG.routeStatsBase;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const m = (v) => '$' + (v / 1e6).toFixed(2) + 'm', pc = (v) => (v == null ? '–' : Math.round(v * 100) + '%'), n0 = (v) => (v == null ? '–' : Math.round(v));
  const BUDGETS = [900000, 1000000, 1320000, 1600000, 2000000, 2500000, 3500000];
  const budget = Math.round(Number(params.get('budget') || 1320000));
  const today = CFG.mode === 'test' && params.get('today') ? params.get('today') : new Date().toISOString().slice(0, 10);
  const quick = BUDGETS.map((b) => `<a href="?budget=${b}">${m(b)}</a>`).join('');
  const head = (extra) => `<div class="kpt-section" style="padding-top:16px;"><p class="kpt-eyebrow">Engine audit</p><h1 class="kpt-h2">At ${m(budget)}</h1>${extra || ''}
    <form class="bud" method="get"><label>Budget $ <input name="budget" value="${budget}" inputmode="numeric"></label><button class="kpt-cta kpt-cta--quiet" type="submit">Run</button></form><div class="quick">${quick}</div></div>`;
  function fail(msg) { document.getElementById('root').innerHTML = head('<p class="kpt-note"><span class="lv error">Cannot run</span> ' + esc(msg) + '</p>'); }
  fetch(base + 'index.json').then((r) => { if (!r.ok) throw new Error('index.json not found at ' + base); return r.json(); }).then((index) => {
    if (!index.shards || !index.shards.length) return fail('No route stats have been loaded yet (' + base + '). Generate them with tools/market-data/build-route-stats.js and copy the output here.');
    const E = ENG.DEFAULTS, sb = ENG.budgetStep(budget, E), start = ENG.shardStart(sb, E);
    return fetch(base + 'shard-' + start + '.json').then((r) => (r.ok ? r.json() : null)).catch(() => null).then((shard) => {
      const res = ENG.run({ budget, step: ENG.pickStep(shard, sb), index, today, notes: [] }, E);
      render(res, index);
    });
  }).catch((e) => fail(e.message));

  function render(r, index) {
    const a = r.audit, test = CFG.mode === 'test';
    const flags = (x) => (x.flags && x.flags.length ? x.flags.map(esc).join(', ') : '');
    const routes = a.routes.slice().sort((x, y) => y.narrow.n - x.narrow.n).map((x) => `<tr><td>${esc(x.id)}</td><td>${x.grade}${x.unstable ? ' · UNSTABLE' : ''}</td><td>${x.narrow.n}</td><td>${x.narrow.projects}</td><td>${pc(x.narrow.top)}</td><td>${n0(x.narrow.med)} (${n0(x.narrow.lo)}–${n0(x.narrow.hi)})</td><td>${x.wide ? x.wide.n + ' · ' + n0(x.wide.med) : '–'}</td><td>${x.position}${x.broadPriceP25 ? ' (price P25 ' + m(x.broadPriceP25) + ')' : ''}</td><td>${flags(x)}</td></tr>`).join('');
    const ins = a.insights.map((i) => `<tr class="${i.outcome === 'SELECTED' ? 'sel' : 'mute'}"><td>${esc(i.key)}</td><td>${i.score.toFixed(3)}</td><td>${i.label}</td><td>${esc(i.headline.larger)} &gt; ${esc(i.headline.smaller)}<br><small>ratio ${i.headline.ratio.toFixed(2)} · conf ${i.headline.confidence} · context ${i.headline.contextFactor} · coverage ${pc(i.headline.coverage)}</small></td><td>${i.supportingPairs.length}</td><td>${esc(i.outcome)}</td></tr>`).join('');
    const trace = a.selectionTrace.map((t) => `<tr><td>${esc(t.key)}</td><td>${t.score.toFixed(3)}</td><td>${esc(t.outcome)}${t.absorbedBy ? ' → ' + esc(t.absorbedBy) : ''}${t.rank ? ' (#' + t.rank + ')' : ''}</td></tr>`).join('');
    const pairs = a.pairs.slice().sort((x, y) => y.score - x.score).map((p) => `<tr class="${p.pass ? '' : 'mute'}"><td>${esc(p.attribute)}: ${esc(p.direction)}</td><td>${esc(p.larger)} &gt; ${esc(p.smaller)}</td><td>${p.ratio.toFixed(2)}${p.ratioWide ? ' / ' + p.ratioWide.toFixed(2) + ' wide' : ''}</td><td>${p.pass ? 'PASS' : esc(p.reasons.join(' + '))}${p.flags.length ? ' · ' + esc(p.flags.join(',')) : ''}</td><td>${p.score.toFixed(3)}</td></tr>`).join('');
    const sents = a.sentences.map((s) => `<div class="sent">${esc(s.text)}<small>${esc(s.id)} · wording class: ${esc(s.cls)} · built from <code>${esc(JSON.stringify(s.fields))}</code></small></div>`).join('') || '<p class="kpt-note">No sentences generated.</p>';
    const ec = a.ec ? `<p class="kpt-note">${a.ec.total ? a.ec.total.n + ' deals, ' + a.ec.total.projects + ' projects, median ' + n0(a.ec.total.med) + ' sqft (' + n0(a.ec.total.lo) + '–' + n0(a.ec.total.hi) + '), grade ' + a.ec.grade + ' → ' + (a.ec.lineShown ? 'line shown' : 'no EC line') : 'No EC deals in the window'}</p>` +
      (a.ec.routes.length ? '<table class="chk"><tr><th>EC route</th><th>Grade</th><th>Deals</th><th>Median sqft</th><th>Cross-reference with private</th></tr>' + a.ec.routes.map((x) => `<tr><td>${esc(x.route)}</td><td>${x.grade}</td><td>${x.narrow.n}</td><td>${n0(x.narrow.med)}</td><td>${x.crossReference ? esc(x.crossReference.against) + ' (' + n0(x.crossReference.privateMedian) + '): ratio ' + x.crossReference.ratio.toFixed(2) + ' ' + (x.crossReference.pass ? 'PASS' : 'FAIL ' + esc(x.crossReference.reasons.join(' + '))) : 'no private counterpart'}</td></tr>`).join('') + '</table>' : '') : '<p class="kpt-note">No EC data.</p>';
    const fb = r.fallback.length ? `<span class="lv warn">${esc(r.fallback.join(', '))}</span> ${esc(a.fallbackReasons.join('; '))}` : '<span class="lv ok">none</span>';
    document.getElementById('root').innerHTML = head(
      (test ? '<p class="kpt-note"><span class="lv warn">TEST DATA</span> Illustrative synthetic route stats, not market data.</p>' : '') +
      `<p class="kpt-note">Source: ${esc(index.source)} · period ${esc(index.period)} · as of ${esc(index.asOf)} (${esc(a.run.freshness)}) · engine ${esc(a.run.engineVersion)} · config hash <code>${esc(a.run.configHash)}</code> · step ${m(a.run.step)}${a.run.windows ? ' · narrow ' + m(a.run.windows.narrow[0]) + '–' + m(a.run.windows.narrow[1]) + ' · wide ' + m(a.run.windows.wide[0]) + '–' + m(a.run.windows.wide[1]) : ''}${a.run.deals ? ' · private deals ' + a.run.deals.narrow + ' narrow / ' + a.run.deals.wide + ' wide' : ''}</p><p class="kpt-note">Fallback: ${fb}</p>`) +
      `<hr class="kpt-rule"><div class="kpt-section"><p class="kpt-eyebrow">What the engine says (data for the later UI)</p>${sents}</div>
      <hr class="kpt-rule"><div class="kpt-section"><p class="kpt-eyebrow">Insights and selection</p>
        <table class="chk"><tr><th>Insight</th><th>Score</th><th>Confidence</th><th>Headline pair</th><th>Support</th><th>Outcome</th></tr>${ins || '<tr><td colspan="6">No insight passed validation.</td></tr>'}</table>
        <details><summary>Selection trace</summary><table class="chk"><tr><th>Insight</th><th>Score</th><th>Outcome</th></tr>${trace}</table>${a.counterfactual && a.counterfactual.boundarySensitive.length ? '<p class="kpt-note">Dropped as BOUNDARY_SENSITIVE: ' + esc(a.counterfactual.boundarySensitive.join(', ')) + '</p>' : ''}</details></div>
      <hr class="kpt-rule"><div class="kpt-section"><p class="kpt-eyebrow">Routes (narrow window)</p>
        <table class="chk"><tr><th>Route</th><th>Grade</th><th>Deals</th><th>Projects</th><th>Top project</th><th>Median sqft (P25–P75)</th><th>Wide deals · median</th><th>Budget vs route</th><th>Flags</th></tr>${routes}</table>
        ${a.insufficientRoutes ? `<p class="kpt-note">Routes below the minimum: ${a.insufficientRoutes.routes} (${a.insufficientRoutes.deals} deals), not compared.</p>` : ''}</div>
      <hr class="kpt-rule"><div class="kpt-section"><p class="kpt-eyebrow">Comparisons</p>
        <p class="kpt-note">${a.pairCounts ? a.pairCounts.total + ' pairs · ' + a.pairCounts.confounded + ' excluded as confounded · ' + a.pairCounts.singleAttribute + ' single-attribute · ' + a.pairCounts.pass + ' pass' : ''}</p>
        <details><summary>All single-attribute pairs</summary><table class="chk"><tr><th>Lens</th><th>Pair (larger &gt; smaller)</th><th>Ratio</th><th>Result</th><th>Score</th></tr>${pairs}</table></details>
        <details><summary>Confounded pairs (${a.confoundedPairs.length})</summary><p class="kpt-note">${a.confoundedPairs.map((c) => esc(c.a) + ' / ' + esc(c.b)).join(' · ')}</p></details></div>
      <hr class="kpt-rule"><div class="kpt-section"><p class="kpt-eyebrow">Executive Condominiums (separate)</p>${ec}</div>
      <hr class="kpt-rule"><div class="kpt-section"><p class="kpt-eyebrow">Wording check</p><p class="kpt-note">${a.lint.length ? '<span class="lv error">' + a.lint.length + ' sentence(s) failed</span> ' + esc(JSON.stringify(a.lint)) : '<span class="lv ok">All generated sentences pass the banned-wording check.</span>'}</p></div>`;
  }
})();
</script>
</body></html>
